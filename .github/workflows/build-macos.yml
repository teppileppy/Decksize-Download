name: Build macOS universal DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to attach the DMG to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-macos:
    name: Build unsigned universal macOS installer
    runs-on: macos-latest
    steps:
      - name: Check out the release repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract Deckize build source
        run: |
          test -f Deckize-Mac-Build-Source-2026-11-05.zip
          mkdir -p build-source
          unzip -q Deckize-Mac-Build-Source-2026-11-05.zip -d build-source

      - name: Create the macOS app icon
        run: |
          set -euo pipefail
          ICON_SOURCE="build-source/desktop/assets/deckize-mac-icon-source.png"
          ICONSET="build-source/desktop/assets/deckize.iconset"
          mkdir -p "$ICONSET"
          sips -z 16 16 "$ICON_SOURCE" --out "$ICONSET/icon_16x16.png" >/dev/null
          sips -z 32 32 "$ICON_SOURCE" --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$ICON_SOURCE" --out "$ICONSET/icon_32x32.png" >/dev/null
          sips -z 64 64 "$ICON_SOURCE" --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$ICON_SOURCE" --out "$ICONSET/icon_128x128.png" >/dev/null
          sips -z 256 256 "$ICON_SOURCE" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$ICON_SOURCE" --out "$ICONSET/icon_256x256.png" >/dev/null
          sips -z 512 512 "$ICON_SOURCE" --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$ICON_SOURCE" --out "$ICONSET/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$ICON_SOURCE" --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "build-source/desktop/assets/deckize.icns"

      - name: Install desktop dependencies
        working-directory: build-source/desktop
        run: npm ci

      - name: Build unsigned universal DMG
        working-directory: build-source/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:mac

      - name: Verify the DMG
        run: test -s "build-source/downloads/_build/Deckize-macOS-Universal.dmg"

      - name: Save the DMG as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deckize-macOS-Universal
          path: build-source/downloads/_build/Deckize-macOS-Universal.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Attach the DMG to the existing public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          DMG_PATH: build-source/downloads/_build/Deckize-macOS-Universal.dmg
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" "$DMG_PATH" --repo "$GITHUB_REPOSITORY" --clobber
